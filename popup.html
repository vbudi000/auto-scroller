<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Scroller</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: #1f2328;
      background: #ffffff;
      padding: 16px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 svg { flex-shrink: 0; }

    .params-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 3px;
      color: #57606a;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      color: #1f2328;
      background: #f6f8fa;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus {
      border-color: #3b82d4;
      background: #fff;
    }

    .unit {
      white-space: nowrap;
      color: #57606a;
      font-size: 11px;
    }

    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #57606a;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="18" height="18" rx="4" fill="#3b82d4"/>
      <polyline points="5,6 9,10 13,6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="5,10 9,14 13,10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Auto Scroller
  </h1>

  <div class="params-row">
    <div class="field">
      <label for="interval">Interval</label>
      <div class="input-row">
        <input type="number" id="interval" min="50" max="10000" value="5000" step="50" />
        <span class="unit">ms</span>
      </div>
    </div>
    <div class="field">
      <label for="amount">Scroll step</label>
      <div class="input-row">
        <input type="number" id="amount" min="1" max="2000" value="100" step="10" />
        <span class="unit">px</span>
      </div>
    </div>
  </div>

  <p class="hint">Use the widget on the page<br>to start &amp; stop scrolling.</p>

  <script src="popup.js"></script>
</body>
</html>
