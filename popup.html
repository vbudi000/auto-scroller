<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Scroller</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: #1f2328;
      background: #ffffff;
      padding: 16px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 svg { flex-shrink: 0; }

    .params-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field {
      flex: 1;
      min-width: 0;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 3px;
      color: #57606a;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      color: #1f2328;
      background: #f6f8fa;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus {
      border-color: #3b82d4;
      background: #fff;
    }

    .unit {
      white-space: nowrap;
      color: #57606a;
      font-size: 11px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 16px 0;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:active { opacity: 0.8; }

    #btn-start {
      background: #3b82d4;
      color: #fff;
    }

    #btn-stop {
      background: #e5e7eb;
      color: #1f2328;
    }

    #btn-start:disabled,
    #btn-stop:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #57606a;
      min-height: 16px;
    }

    #status.running { color: #3b82d4; font-weight: 600; }
  </style>
</head>
<body>
  <h1>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="18" height="18" rx="4" fill="#3b82d4"/>
      <polyline points="5,6 9,10 13,6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="5,10 9,14 13,10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Auto Scroller
  </h1>

  <div class="params-row">
    <div class="field">
      <label for="interval">Interval</label>
      <div class="input-row">
        <input type="number" id="interval" min="50" max="10000" value="2000" step="50" />
        <span class="unit">ms</span>
      </div>
    </div>
    <div class="field">
      <label for="amount">Scroll step</label>
      <div class="input-row">
        <input type="number" id="amount" min="1" max="2000" value="200" step="10" />
        <span class="unit">px</span>
      </div>
    </div>
  </div>

  <hr class="divider" />

  <div class="btn-row">
    <button id="btn-start">▶ Start</button>
    <button id="btn-stop" disabled>■ Stop</button>
  </div>

  <div id="status">Idle</div>

  <script src="popup.js"></script>
</body>
</html>
